{extend name="layout/base" /}
{block name="extra_head"}<link rel="stylesheet" href="/static/css/pages/user.css?v={$assets.css_ver}">{/block}
{block name="content"}
<div class="user-page" style="background:linear-gradient(180deg,#afa7ef 0%,#f6f6f6 30%);">
    <div class="page-head" style="background:transparent; border-bottom:0;">
        <a class="back-btn" href="javascript:history.back()" aria-label="返回" style="color:#fff;">‹</a>
        <h1 class="page-title" style="color:#fff;">分享</h1>
    </div>
    <div style="background:#fff; margin:12px 16px; padding:24px 16px; border-radius:15px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.08);">
        <h2 style="font-size:17px; color:#1B1B1B; margin:0 0 12px;">扫码访问 / 分享给朋友</h2>
        <img src="{$qrcode}" alt="二维码" style="width:240px; height:240px; margin:0 auto;">
        <div style="margin-top:12px; font-size:12px; color:#999; word-break:break-all;">{$url}</div>
        <button onclick="navigator.clipboard.writeText('{$url}').then(()=>{this.textContent='已复制'})" style="margin-top:20px; padding:10px 30px; background:#FE739D; color:#fff; border:0; border-radius:20px; font-size:14px;">复制链接</button>
    </div>
    {include file="components/_tabbar" /}
</div>
{/block}
