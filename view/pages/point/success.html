{extend name="layout/base" /}
{block name="content"}
<div style="min-height:100vh; background:#f6f6f6; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;">
    <div style="font-size:80px; color:#4CD964; margin-bottom:15px;">✓</div>
    <h1 style="font-size:21px; color:#1B1B1B; margin:0 0 10px;">兑换成功</h1>
    <p style="font-size:14px; color:#666; line-height:1.6; margin:0 0 30px;">{if !empty($orderNo)}订单号:{$orderNo}<br>{/if}请耐心等待物流配送</p>
    <a href="/{$lang_seg}/me/order" style="display:inline-block; padding:12px 30px; background:#FE739D; color:#fff; border-radius:24px; font-size:15px; text-decoration:none;">查看订单</a>
</div>
{/block}
