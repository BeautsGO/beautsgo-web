{extend name="layout/base" /}
{block name="extra_head"}
<style>
.share-bg{position:relative;min-height:100vh;background:#fff url('{$bgImage}') no-repeat top center / 100% auto}
.share-cta{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:12px}
.share-cta a,.share-cta button{padding:14px 32px;border-radius:999px;font-size:12px;background:#fc6290;color:#fff;text-decoration:none;border:0;cursor:pointer}
.share-link-box{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);padding:10px 16px;background:rgba(255,255,255,.9);border-radius:8px;font-size:12px;color:#666;max-width:90vw;word-break:break-all}
</style>
{/block}
{block name="content"}
<section class="share-bg">
    <div class="share-link-box">
        {$tt['share.title']|default='分享链接'}: {$base = config('seo.site_url')}{$base}/{$lang_seg}/?shareId={$shareId}&amp;shareType=1&amp;type=team
    </div>
    <div class="share-cta">
        <a href="{$base}/{$lang_seg}/?shareId={$shareId}&shareType=1&type=team" target="_blank">{$tt['share.btn']|default='前往邀请页'}</a>
    </div>
</section>
{/block}
