{extend name="layout/base" /}
{block name="extra_head"}
<style>
.sms-page{padding:0 0 24px;background:#fff;min-height:100vh}
.sms-search{padding:12px 16px;background:#f7f7f9;position:sticky;top:0;z-index:2}
.sms-search input{width:100%;height:40px;padding:0 14px;border:0;border-radius:999px;background:#fff;font-size:12px}
.sms-list .item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #f0f0f3}
.sms-list .name{font-size:12px;color:#222}
.sms-list .code{font-size:12px;color:#888}
</style>
{/block}
{block name="content"}
<section class="sms-page">
    <form class="sms-search" method="get" action="">
        <input type="search" name="q" value="{$Request.param.q|default=''}" placeholder="{$tt['phone.code.plcTxt']|default='搜索国家或地区'}">
    </form>
    <div class="sms-list">
        {foreach $list as $item}
        {if !empty($item.name_cn) || !empty($item.name_en)}
        <a class="item" href="?dial={$item.dial|default=''}">
            <div>
                <span class="name">{$item.name_cn|default=$item.name|default=''}</span>
                <span class="code">({$item.name_en|default=''})</span>
            </div>
            <span class="code">+{$item.dial|default=''}</span>
        </a>
        {/if}
        {/foreach}
    </div>
</section>
{/block}
