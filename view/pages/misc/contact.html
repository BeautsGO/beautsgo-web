{extend name="layout/base" /}
{block name="extra_head"}
<style>
.contact-iframe-wrap{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;max-width:640px;height:100vh;background:#fff}
.contact-iframe-wrap iframe{width:100%;height:100%;border:0;display:block}
</style>
{/block}
{block name="content"}
<div class="contact-iframe-wrap">
    <iframe src="{$iframeSrc}" referrerpolicy="no-referrer-when-downgrade" allow="clipboard-write; clipboard-read"></iframe>
</div>
{/block}
