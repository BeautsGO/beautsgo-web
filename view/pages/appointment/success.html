{extend name="layout/base" /}

{block name="extra_head"}
<style>
.appt-success { min-height:100vh; background:#f6f6f6; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; }
.appt-success__icon { font-size:80px; color:#4CD964; margin-bottom:15px; }
.appt-success h1 { font-size:21px; color:#1B1B1B; margin:0 0 10px; }
.appt-success p { font-size:14px; color:#666; line-height:1.6; margin:0 0 30px; }
.appt-success .btn { display:inline-block; padding:12px 30px; background:#FE739D; color:#fff; border-radius:24px; font-size:15px; text-decoration:none; }
</style>
{/block}

{block name="content"}
<div class="appt-success">
    <div class="appt-success__icon">✓</div>
    <h1>{$tt['order.successTitle']|default='预约提交成功'}</h1>
    <p>{$message|default=$tt['order.successTip']|default='工作人员会尽快与您取得联系'}</p>
    <div style="display:flex;gap:12px">
        <a class="btn" href="/{$lang_seg}/me/order">{$tt['order.viewMyOrder']|default='查看我的预约'}</a>
        <a class="btn" href="/{$lang_seg}/" style="background:#fff;color:#666;border:1px solid #ddd">{$tt['order.backHome']|default='返回首页'}</a>
    </div>
</div>
{/block}
