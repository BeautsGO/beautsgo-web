{extend name="layout/base" /}
{block name="extra_head"}<link rel="stylesheet" href="/static/css/pages/user.css?v={$assets.css_ver}">{/block}
{block name="content"}
<div class="user-page">
    <div class="page-head">
        <a class="back-btn" href="/{$lang_seg}/me/cases" aria-label="返回">‹</a>
        <h1 class="page-title">写案例</h1>
    </div>
    {if $saved}<div class="msg-ok">案例已发布,等待审核</div>{/if}
    {if !empty($error)}<div class="msg-err">{$error}</div>{/if}
    <form method="post" action="/{$lang_seg}/me/cases/new">
        <div class="u-form-card">
            <div class="u-form-row">
                <div class="u-form-row__label">关联类型</div>
                <div class="u-form-row__field">
                    <select name="type">
                        <option value="1">机构</option>
                        <option value="2">医生</option>
                        <option value="3">项目</option>
                    </select>
                </div>
            </div>
            <div class="u-form-row">
                <div class="u-form-row__label">关联 ID</div>
                <div class="u-form-row__field"><input type="number" name="with_id" placeholder="机构/医生/项目 ID" required></div>
            </div>
            <div class="u-form-row">
                <div class="u-form-row__label">分享内容</div>
                <div class="u-form-row__field"><textarea name="content" rows="6" placeholder="描述您的就医体验、效果、心得…" required></textarea></div>
            </div>
            <div class="u-form-row">
                <div class="u-form-row__label">图片 JSON</div>
                <div class="u-form-row__field"><textarea name="pictures" rows="3" placeholder='[{"url":"https://..."}]'></textarea></div>
            </div>
        </div>
        <button class="u-btn-primary" type="submit">发布</button>
    </form>
    {include file="components/_tabbar" /}
</div>
{/block}
